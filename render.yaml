services:
  - type: web
    name: registration-backend
    runtime: docker
    plan: free
    branch: main
    healthCheckPath: /api/users
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://mysql-2c2dc18b-registationlogin.k.aivencloud.com:20955/defaultdb?sslMode=REQUIRED&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - key: SPRING_DATASOURCE_USERNAME
        value: avnadmin
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: APP_COOKIE_SECURE
        value: "true"
      - key: APP_COOKIE_SAME_SITE
        value: None
      - key: APP_CORS_ALLOWED_ORIGINS
        value: http://localhost:5173